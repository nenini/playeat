spring:
  profiles:
    active: local

  # ────────────────────────────────
  # Jackson
  # ────────────────────────────────
  jackson:
    time-zone: Asia/Seoul
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  ai:
    model:
      chat: none
      embedding: openai
    openai:
      base-url: ${GMS_OPENAI_BASE_URL:https://gms.ssafy.io/gmsapi/api.openai.com}
      api-key: ${GMS_KEY:placeholder-set-gms-key-for-rag}
      embedding:
        embeddings-path: /v1/embeddings
        options:
          model: ${GMS_EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_GRPC_PORT:6334}
        collection-name: ${QDRANT_COLLECTION:nyamnyam_health_guides}
        use-tls: ${QDRANT_USE_TLS:false}
        initialize-schema: ${QDRANT_INITIALIZE_SCHEMA:false}

app:
  upload:
    root-dir: ${UPLOAD_ROOT_DIR:uploads}
    profile-image-dir: ${PROFILE_IMAGE_UPLOAD_DIR:${UPLOAD_ROOT_DIR:uploads}/profile-images}
    profile-image-path-prefix: /uploads/profile-images

gms:
  enabled: ${GMS_ENABLED:false}
  base-url: ${GMS_BASE_URL:https://gms.ssafy.io/gmsapi/api.openai.com/v1}
  model: ${GMS_MODEL:gpt-5-mini}
  embedding-model: ${GMS_EMBEDDING_MODEL:text-embedding-3-small}
  api-key: ${GMS_KEY:}
  timeout-ms: ${GMS_TIMEOUT_MS:10000}

rag:
  health-guides:
    seed-location: ${RAG_HEALTH_GUIDE_SEED:classpath:rag/health-guides/health-guides.jsonl}
    ingestion-enabled: ${RAG_INGESTION_ENABLED:false}
    top-k: ${RAG_HEALTH_GUIDE_TOP_K:5}
    similarity-threshold: ${RAG_HEALTH_GUIDE_SIMILARITY_THRESHOLD:0.5}

# ────────────────────────────────
# MyBatis
# ────────────────────────────────
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    use-generated-keys: true
    default-fetch-size: 100
    default-statement-timeout: 30
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  mapper-locations: classpath:mappers/**/*.xml
  type-aliases-package: com.nyamnyam.coach

# ────────────────────────────────
# JWT
# ────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXP:1800000}
  refresh-token-expiration: ${JWT_REFRESH_EXP:604800000}

# ────────────────────────────────
# Swagger / SpringDoc
# ────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# ────────────────────────────────
# Server
# ────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

# ────────────────────────────────
# Logging
# ────────────────────────────────
logging:
  level:
    root: INFO
    com.nyamnyam.coach: DEBUG
    org.mybatis: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
