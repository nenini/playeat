spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 콘솔 (테스트 시 디버깅용)
  h2:
    console:
      enabled: true

  # Redis mock (테스트에서 실제 Redis 연결 불필요)
  data:
    redis:
      host: localhost
      port: 6370  # 존재하지 않는 포트로 설정 (테스트에서 Redis 미사용 시)

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mappers/**/*.xml

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZy10ZXN0
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

logging:
  level:
    com.nyamnyam.coach: DEBUG
    org.mybatis: INFO
