spring:
  profiles:
    active: local

  # ────────────────────────────────
  # DataSource (HikariCP)
  # ────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nyamnyam?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:nyamnyam}
    password: ${DB_PASSWORD:nyamnyam1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ────────────────────────────────
  # Redis
  # ────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # ────────────────────────────────
  # Jackson
  # ────────────────────────────────
  jackson:
    time-zone: Asia/Seoul
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

# ────────────────────────────────
# MyBatis
# ────────────────────────────────
mybatis:
  configuration:
    map-underscore-to-camel-case: true   # snake_case → camelCase 자동 매핑
    use-generated-keys: true
    default-fetch-size: 100
    default-statement-timeout: 30
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  mapper-locations: classpath:mappers/**/*.xml
  type-aliases-package: com.nyamnyam.coach

# ────────────────────────────────
# JWT
# ────────────────────────────────
jwt:
  secret: cmmrPhjdvcP5k4zIobW0qpJZhQBPQOgcr5jzzAdoX9o=
  access-token-expiration: ${JWT_ACCESS_EXP:1800000}    # 30분 (ms)
  refresh-token-expiration: ${JWT_REFRESH_EXP:604800000} # 7일 (ms)

# ────────────────────────────────
# Swagger / SpringDoc
# ────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# ────────────────────────────────
# Server
# ────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

# ────────────────────────────────
# Logging
# ────────────────────────────────
logging:
  level:
    root: INFO
    com.nyamnyam.coach: DEBUG
    org.mybatis: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
