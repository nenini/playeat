version: "3.9"

services:

  # ────────────────────────────────
  # MySQL 8
  # ────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: nyamnyam-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root1234}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nyamnyam}
      MYSQL_USER: ${MYSQL_USER:-nyamnyam}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nyamnyam1234}
      TZ: Asia/Seoul
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro  # 초기 DDL (있을 경우)
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root1234}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────────
  # Redis
  # ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nyamnyam-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-} --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ────────────────────────────────
  # Spring Boot App
  # ────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nyamnyam-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-nyamnyam}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER:-nyamnyam}
      DB_PASSWORD: ${MYSQL_PASSWORD:-nyamnyam1234}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXP: ${JWT_ACCESS_EXP:-1800000}
      JWT_REFRESH_EXP: ${JWT_REFRESH_EXP:-604800000}
      SERVER_PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - app-logs:/app/logs

volumes:
  mysql-data:
  redis-data:
  app-logs:
